[package]
name = "velora-capability"
version = "0.1.0"
edition = "2024"
description = "Procedures and observation sources the system defines for itself"

[dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util"] }
velora-event = { path = "../velora-event" }
velora-exec = { path = "../velora-exec" }
velora-log = { path = "../velora-log" }
velora-loop = { path = "../velora-loop" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
velora-log = { path = "../velora-log" }
