[package]
name = "velora-exec"
version = "0.1.0"
edition = "2024"
description = "Devices, procedures, and running them"

[dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "fs", "io-util"] }
velora-event = { path = "../velora-event" }
velora-log = { path = "../velora-log" }
velora-loop = { path = "../velora-loop" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
