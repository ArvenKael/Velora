[package]
name = "velora-operator"
version = "0.1.0"
edition = "2024"
description = "The dialogue between the operator and the system, as events"

[dependencies]
async-trait = "0.1"
serde_json = "1"
velora-event = { path = "../velora-event" }
velora-exec = { path = "../velora-exec" }
velora-log = { path = "../velora-log" }
velora-loop = { path = "../velora-loop" }
velora-reason = { path = "../velora-reason" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
