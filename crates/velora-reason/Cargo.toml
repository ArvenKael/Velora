[package]
name = "velora-reason"
version = "0.1.0"
edition = "2024"
description = "Thinking, as durable turns where every thought and step is an event"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
velora-config = { path = "../velora-config" }
velora-event = { path = "../velora-event" }
velora-exec = { path = "../velora-exec" }
velora-llm = { path = "../velora-llm" }
velora-log = { path = "../velora-log" }
velora-loop = { path = "../velora-loop" }

[dev-dependencies]
velora-storage = { path = "../velora-storage" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
